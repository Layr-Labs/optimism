name: Kurtosis Devnet

on:
  push:
    branches: [eigenda-develop]
  pull_request:
  # Workflow dispatch allows you to trigger this workflow manually from the Actions tab.
  # We use this to trigger the workflow on release branches.
  workflow_dispatch:

env:
  MISE_VERSION: 2024.12.14

jobs:
  # Tests that run against a kurtosis devnet that uses the proxy in memstore mode.
  run_op_eigenda_memstore_devnet:
    strategy:
      fail-fast: false # run all matrix jobs even if one fails
      matrix:
        # This list should be kept up-to-date with the files in eigenda-template-values
        valuesFile: ["memstore-sequential-small-blobs.json, memstore-concurrent-large-blobs.json"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          version: ${{ env.MISE_VERSION }}
          experimental: true
      - run: just eigenda-devnet-start eigenda-template-values/${{ matrix.valuesFile }}
        working-directory: kurtosis-devnet
      - run: just eigenda-devnet-test-memstore
        working-directory: kurtosis-devnet

  # This is an optimism devnet which talks to the eigenda holesky testnet via an eigenda-proxy.
  # TODO: we should connect this to an eigenda kurtosis devnet instead of using our holesky testnet.
  run_op_eigenda_holesky_devnet:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # run all matrix jobs even if one fails
      matrix:
        # This list should be kept up-to-date with the files in eigenda-template-values
        valuesFile: ["memstore-sequential-small-blobs.json, memstore-concurrent-large-blobs.json"]
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          version: ${{ env.MISE_VERSION }}
          experimental: true
      # Needed by the just eigenda-devnet command below
      # This config gets injected into the eigenda.yaml kurtosis template config file
      - name: Update memstore values file to use holesky (including needed secrets)
        run: |
          jq --argjson newconfig '{
            "eigenda-proxy": {
              "useMemstore": false,
              "secrets": {
                "eigenda.signer-private-key-hex": "${{ secrets.EIGENDA_V1_HOLESKY_TESTNET_SIGNER_KEY }}",
                "eigenda.eth_rpc": "https://ethereum-holesky-rpc.publicnode.com"
              }
            }
          }' '. *= $newconfig' eigenda-template-values/memstore-sequential-small-blobs.json > holesky-config.json
        working-directory: kurtosis-devnet
      - run: just eigenda-devnet-start holesky-config.json
        working-directory: kurtosis-devnet
      - run: just eigenda-devnet-test-holesky
        working-directory: kurtosis-devnet
